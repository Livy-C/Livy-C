name: GitHub Metrics

on:
  schedule:
    # 08:00 Asia/Shanghai every day
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Skipped (not failed) until the METRICS_TOKEN secret exists.
      - name: Generate metrics
        if: env.METRICS_TOKEN != ''
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: Livy-C
          filename: github-metrics.svg
          committer_token: ${{ github.token }}
          committer_message: "chore: update github-metrics.svg [skip ci]"

          # layout
          template: classic
          config_timezone: Asia/Shanghai
          config_display: columns
          config_padding: 0, 8 + 11%

          # base blocks (header omitted on purpose: the README has its own banner)
          base: activity, community, repositories, metadata

          # commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: lines, bytes-size, percentage

          # lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # achievements (the fun part)
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: detailed

          # stargazers on the most popular projects
          plugin_stargazers: yes
