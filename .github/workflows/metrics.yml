name: GitHub Metrics

on:
  schedule:
    # 08:00 Asia/Shanghai every day
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Skipped (not failed) until the METRICS_TOKEN secret exists.
      - name: Generate metrics
        if: env.METRICS_TOKEN != ''
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ env.METRICS_TOKEN }}
          user: Livy-C
          filename: github-metrics.svg
          committer_token: ${{ github.token }}
          committer_message: "chore: update github-metrics.svg [skip ci]"

          # layout
          template: classic
          config_timezone: Asia/Shanghai
          config_display: columns
          config_padding: 0, 8 + 11%

          # base blocks (header omitted on purpose: the README has its own banner)
          base: activity, community, repositories, metadata

          # commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: lines, bytes-size, percentage

          # lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # NOTE: plugin_habits and plugin_achievements are disabled on purpose.
          # Both crash inside lowlighter/metrics (@latest):
          #   habits       -> TypeError at source/plugins/habits/index.mjs:51, because GitHub's
          #                   events API returns PushEvents without payload.commits
          #                   (payload only has repository_id, push_id, ref, head, before)
          #   achievements -> GraphqlResponseError, the plugin still queries the retired
          #                   "Projects (classic)" field
          # metrics renders "Unexpected error" into the card instead of failing the run, so
          # the run stays green either way. Re-enable once upstream fixes them.

          # stargazers on the most popular projects
          plugin_stargazers: yes
